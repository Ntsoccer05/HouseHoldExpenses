[Date]
date.timezone = "Asia/Tokyo"
[mbstring]
mbstring.language = "Japanese"
[PHP]
display_errors = On
memory_limit = 500M
upload_max_filesize = 500M
post_max_size = 500M

[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; CVE-2026-109618/109619 (php2shell) の多層防御。本アプリはアップロード進捗機能を使わないため無効化する。
; 根本対策はPHP本体の更新(8.2.35以降)であり、この設定のみでは不十分。
session.upload_progress.enabled = Off

; レスポンスヘッダー X-Powered-By で PHP のバージョンを公開しない（攻撃対象の絞り込みを防ぐ）
expose_php = Off
