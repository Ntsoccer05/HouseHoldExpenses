; Brefの標準PHPランタイムにはintl拡張(.so)が同梱されているがデフォルト無効のため、
; ここで明示的に有効化する。Filamentのテーブルコンポーネント等がLaravelの
; Illuminate\Support\Number::format()(intl依存)を使用しており、無効のままだと
; ViewException("The \"intl\" PHP extension is required to use the [format] method.")
; で500エラーになる。
; 参考: https://bref.sh/docs/environment/php
extension=intl

; CVE-2026-109618/109619 (php2shell) の多層防御。本アプリはアップロード進捗機能を使わないため無効化する。
; 根本対策はPHP本体の更新(8.2.35以降)であり、この設定のみでは不十分。
session.upload_progress.enabled = Off

; レスポンスヘッダー X-Powered-By で PHP のバージョンを公開しない（攻撃対象の絞り込みを防ぐ）
expose_php = Off
