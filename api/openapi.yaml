openapi: 3.0.0
info:
  title: HouseHold Expenses API
  description: 家計簿管理アプリケーション（カケポン）のAPI仕様
  version: 1.1.0
  contact:
    name: Development Team

servers:
  - url: http://localhost:9000/api
    description: ローカル開発環境
  - url: https://api.example.com/api
    description: 本番環境

tags:
  - name: Health
    description: ヘルスチェック
  - name: Auth
    description: 認証・ユーザー管理
  - name: IncomeCategory
    description: 収入カテゴリ管理
  - name: ExpenseCategory
    description: 支出カテゴリ管理
  - name: Transaction
    description: 取引（収入・支出）管理
  - name: FixedExpense
    description: 固定費管理
  - name: SplitGroup
    description: 分担グループ・支出の割り勘管理
  - name: Social
    description: ソーシャルログイン

paths:
  # ============= Health Check =============
  /health:
    get:
      tags:
        - Health
      summary: ヘルスチェック
      description: API サーバーの稼働確認
      responses:
        '200':
          $ref: './responses/common.yaml#/HealthCheckSuccess'

  # ============= Authentication =============
  /login:
    post:
      tags:
        - Auth
      summary: ログイン
      description: ユーザーのメールアドレスとパスワードでログイン
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/user.yaml#/LoginRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/LoginSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

  /register:
    post:
      tags:
        - Auth
      summary: 仮登録
      description: ユーザーの仮登録（メール認証待ち）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/user.yaml#/RegisterRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/RegisterSuccess'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  /logout:
    post:
      tags:
        - Auth
      summary: ログアウト
      description: ユーザーをログアウト
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

  /user:
    get:
      tags:
        - Auth
      summary: 現在のユーザー情報取得
      description: ログイン中のユーザー情報を取得
      security:
        - BearerAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                $ref: './schemas/user.yaml#/User'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

  /email/verify/{id}/{hash}:
    get:
      tags:
        - Auth
      summary: メールアドレス認証
      description: メール本文のリンクからメールアドレスを認証
      parameters:
        - $ref: './parameters/common.yaml#/IdPathParameter'
        - $ref: './parameters/common.yaml#/HashPathParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /email/verification-notification:
    post:
      tags:
        - Auth
      summary: 確認メール再送信
      description: メール認証メールを再度送信
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /password/forget:
    post:
      tags:
        - Auth
      summary: パスワードリセット（メール送信）
      description: パスワードリセット用のメール送信
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/user.yaml#/PasswordResetRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /password/reset:
    post:
      tags:
        - Auth
      summary: パスワードリセット（確定）
      description: リセットトークンを使ってパスワードを変更
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/user.yaml#/PasswordResetConfirmRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  # ============= Income Category =============
  /IncomeCategory:
    get:
      tags:
        - IncomeCategory
      summary: 収入カテゴリ一覧取得
      description: ログインユーザーの収入カテゴリ一覧を取得
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './responses/common.yaml#/IncomeCategoryArraySuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

  /addIncomeCategory:
    post:
      tags:
        - IncomeCategory
      summary: 収入カテゴリ追加
      description: 新しい収入カテゴリを追加
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/AddCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/IncomeCategorySuccess'

  /updateIncomeCategory:
    post:
      tags:
        - IncomeCategory
      summary: 収入カテゴリ更新
      description: 収入カテゴリを更新
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/UpdateCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /deleteIncomeCategory:
    post:
      tags:
        - IncomeCategory
      summary: 収入カテゴリ削除
      description: 収入カテゴリを削除（ソフトデリート）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/DeleteCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /sortIncomeCategory:
    post:
      tags:
        - IncomeCategory
      summary: 収入カテゴリソート
      description: 収入カテゴリの表示順序を変更
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/SortCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /batchSaveIncomeCategories:
    post:
      tags:
        - IncomeCategory
      summary: 収入カテゴリ一括保存
      description: 複数の収入カテゴリの表示名・アイコン・フィルタ順を一括更新
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/BatchSaveCategoriesRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  # ============= Expense Category =============
  /ExpenseCategory:
    get:
      tags:
        - ExpenseCategory
      summary: 支出カテゴリ一覧取得
      description: ログインユーザーの支出カテゴリ一覧を取得
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './responses/common.yaml#/ExpenseCategoryArraySuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

  /addExpenseCategory:
    post:
      tags:
        - ExpenseCategory
      summary: 支出カテゴリ追加
      description: 新しい支出カテゴリを追加
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/AddCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/ExpenseCategorySuccess'

  /updateExpenseCategory:
    post:
      tags:
        - ExpenseCategory
      summary: 支出カテゴリ更新
      description: 支出カテゴリを更新
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/UpdateCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /deleteExpenseCategory:
    post:
      tags:
        - ExpenseCategory
      summary: 支出カテゴリ削除
      description: 支出カテゴリを削除（ソフトデリート）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/DeleteCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /sortExpenseCategory:
    post:
      tags:
        - ExpenseCategory
      summary: 支出カテゴリソート
      description: 支出カテゴリの表示順序を変更
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/SortCategoryRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /batchSaveExpenseCategories:
    post:
      tags:
        - ExpenseCategory
      summary: 支出カテゴリ一括保存
      description: 複数の支出カテゴリの表示名・アイコン・フィルタ順を一括更新
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/category.yaml#/BatchSaveCategoriesRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  # ============= Transaction =============
  /addTransaction:
    post:
      tags:
        - Transaction
      summary: 取引記録追加
      description: 新しい取引（収入または支出）を記録
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/transaction.yaml#/AddTransactionRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/TransactionSuccess'

  /getTransactions:
    get:
      tags:
        - Transaction
      summary: 取引一覧取得
      description: ログインユーザーの取引一覧を取得（ページネーション対応）
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/PageParameter'
        - $ref: './parameters/common.yaml#/PerPageParameter'
        - $ref: './parameters/common.yaml#/CategoryIdParameter'
        - $ref: './parameters/common.yaml#/TypeIdParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/TransactionArraySuccess'

  /updateTransaction:
    post:
      tags:
        - Transaction
      summary: 取引更新
      description: 取引内容を更新
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/transaction.yaml#/UpdateTransactionRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /deleteTransaction:
    post:
      tags:
        - Transaction
      summary: 取引削除
      description: 取引を削除
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/transaction.yaml#/DeleteTransactionRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

  /copyMultipleContents:
    post:
      tags:
        - Transaction
      summary: 複数取引コピー
      description: 同一日付の複数支出を別の日付へコピー
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/transaction.yaml#/CopyMultipleContentsRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/CopyMultipleContentsSuccess'
        '400':
          $ref: './responses/common.yaml#/CopyMultipleContentsError'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  /monthly-transaction:
    get:
      tags:
        - Transaction
      summary: 月別取引サマリー
      description: 指定年月の取引を集計
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/YearParameter'
        - $ref: './parameters/common.yaml#/MonthParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/MonthlySummarySuccess'

  /monthly-transactions-bulk:
    get:
      tags:
        - Transaction
      summary: 複数月の取引一括取得
      description: 基準月を中心に前々月・前月・当月・翌月の4ヶ月分の取引データを一括取得
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/BaseMonthParameter'
        - $ref: './parameters/common.yaml#/UserIdQueryParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/MonthlyTransactionsBulkSuccess'
        '500':
          description: データの取得に失敗しました

  /yearly-transaction:
    get:
      tags:
        - Transaction
      summary: 年別取引サマリー
      description: 指定年の月別取引を集計
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/YearParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/YearlySummarySuccess'

  # ============= Fixed Expense =============
  /fixed-expenses:
    get:
      tags:
        - FixedExpense
      summary: 固定費一覧取得
      description: ログインユーザーの固定費一覧を取得
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './responses/common.yaml#/FixedExpenseArraySuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

    post:
      tags:
        - FixedExpense
      summary: 固定費作成
      description: 新しい固定費を作成する（種別ごとに最大10件まで）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/fixed_expense.yaml#/StoreFixedExpenseRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/FixedExpenseSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '422':
          description: バリデーションエラー、または種別ごとの登録上限（10件）超過

  /fixed-expenses/{fixedExpense}:
    put:
      tags:
        - FixedExpense
      summary: 固定費更新
      description: 固定費を更新（is_active を false にすると deactivated_at が自動設定される）
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/FixedExpenseIdPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/fixed_expense.yaml#/UpdateFixedExpenseRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/FixedExpenseSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'

    delete:
      tags:
        - FixedExpense
      summary: 固定費削除
      description: 固定費を削除
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/FixedExpenseIdPathParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'

  # ============= Split Group =============
  /monthly-summary:
    get:
      tags:
        - SplitGroup
      summary: 月次サマリー（グループなし共有用）
      description: 指定月の収入・支出・収支を集計（分担グループを作成していない場合の簡易共有用）
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/MonthStringParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/SplitGroupMonthlySummarySuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  /split-groups:
    get:
      tags:
        - SplitGroup
      summary: 分担グループ一覧取得
      description: ログインユーザーの分担グループ一覧を設定・カテゴリ上書きとともに取得
      security:
        - BearerAuth: []
      responses:
        '200':
          $ref: './responses/common.yaml#/SplitGroupArraySuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'

    post:
      tags:
        - SplitGroup
      summary: 分担グループ作成
      description: 新しい分担グループを作成（作成時に設定レコードも自動生成される）
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/split_group.yaml#/StoreSplitGroupRequest'
      responses:
        '201':
          $ref: './responses/common.yaml#/SplitGroupSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  /split-groups/{splitGroup}:
    put:
      tags:
        - SplitGroup
      summary: 分担グループ更新
      description: 分担グループの表示名を更新
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/SplitGroupIdPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/split_group.yaml#/UpdateSplitGroupRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/SplitGroupSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'

    delete:
      tags:
        - SplitGroup
      summary: 分担グループ削除
      description: 分担グループを削除（設定・カテゴリ上書きも連動して削除される）
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/SplitGroupIdPathParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'

  /split-groups/{splitGroup}/settings:
    put:
      tags:
        - SplitGroup
      summary: 分担グループ設定更新
      description: 按分比率・固定調整額を更新。overrides を含めるとカテゴリ別上書き設定を一括置換する
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/SplitGroupIdPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/split_group.yaml#/UpdateSplitGroupSettingsRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/SplitGroupSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  /split-groups/{splitGroup}/category-overrides:
    get:
      tags:
        - SplitGroup
      summary: カテゴリ別上書き設定取得
      description: 分担グループのカテゴリ別按分比率の上書き一覧を取得
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/SplitGroupIdPathParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/CategoryOverridesSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'

    put:
      tags:
        - SplitGroup
      summary: カテゴリ別上書き設定更新
      description: カテゴリ別按分比率の上書き設定を一括置換（空配列で全削除）
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/SplitGroupIdPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/split_group.yaml#/UpdateCategoryOverridesRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/CategoryOverridesSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  /split-groups/{splitGroup}/preview:
    get:
      tags:
        - SplitGroup
      summary: 分担プレビュー取得
      description: 指定月の収入・支出を設定に基づき按分し、自分/相手の負担額プレビューを取得
      security:
        - BearerAuth: []
      parameters:
        - $ref: './parameters/common.yaml#/SplitGroupIdPathParameter'
        - $ref: './parameters/common.yaml#/MonthStringParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/SplitGroupPreviewSuccess'
        '401':
          $ref: './responses/common.yaml#/Unauthorized'
        '403':
          $ref: './responses/common.yaml#/Forbidden'
        '422':
          $ref: './responses/common.yaml#/ValidationError'

  # ============= Social Login =============
  /login/{provider}:
    get:
      tags:
        - Social
      summary: ソーシャルログイン URL取得
      description: OAuth プロバイダーのログイン URL を取得
      parameters:
        - $ref: './parameters/common.yaml#/ProviderPathParameter'
      responses:
        '200':
          $ref: './responses/common.yaml#/OAuthUrlSuccess'

  /login/{provider}/callback:
    post:
      tags:
        - Social
      summary: ソーシャルログイン コールバック
      description: OAuth プロバイダーからのコールバックを処理
      parameters:
        - $ref: './parameters/common.yaml#/ProviderPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/common.yaml#/SocialLoginRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/LoginSuccess'

  /register/{provider}:
    post:
      tags:
        - Social
      summary: ソーシャル登録
      description: OAuth プロバイダーで新規登録
      parameters:
        - $ref: './parameters/common.yaml#/ProviderPathParameter'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/common.yaml#/SocialLoginRequest'
      responses:
        '200':
          $ref: './responses/common.yaml#/Success'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum トークン

  schemas:
    # User Schemas
    User:
      $ref: './schemas/user.yaml#/User'
    LoginRequest:
      $ref: './schemas/user.yaml#/LoginRequest'
    RegisterRequest:
      $ref: './schemas/user.yaml#/RegisterRequest'
    PasswordResetRequest:
      $ref: './schemas/user.yaml#/PasswordResetRequest'
    PasswordResetConfirmRequest:
      $ref: './schemas/user.yaml#/PasswordResetConfirmRequest'

    # Category Schemas
    IncomeCategory:
      $ref: './schemas/category.yaml#/IncomeCategory'
    ExpenseCategory:
      $ref: './schemas/category.yaml#/ExpenseCategory'
    AddCategoryRequest:
      $ref: './schemas/category.yaml#/AddCategoryRequest'
    UpdateCategoryRequest:
      $ref: './schemas/category.yaml#/UpdateCategoryRequest'
    DeleteCategoryRequest:
      $ref: './schemas/category.yaml#/DeleteCategoryRequest'
    SortCategoryRequest:
      $ref: './schemas/category.yaml#/SortCategoryRequest'
    BatchSaveCategoriesRequest:
      $ref: './schemas/category.yaml#/BatchSaveCategoriesRequest'

    # Transaction Schemas
    Transaction:
      $ref: './schemas/transaction.yaml#/Transaction'
    Type:
      $ref: './schemas/transaction.yaml#/Type'
    AddTransactionRequest:
      $ref: './schemas/transaction.yaml#/AddTransactionRequest'
    UpdateTransactionRequest:
      $ref: './schemas/transaction.yaml#/UpdateTransactionRequest'
    DeleteTransactionRequest:
      $ref: './schemas/transaction.yaml#/DeleteTransactionRequest'
    MonthlySummary:
      $ref: './schemas/transaction.yaml#/MonthlySummary'
    YearlySummary:
      $ref: './schemas/transaction.yaml#/YearlySummary'
    FormattedTransaction:
      $ref: './schemas/transaction.yaml#/FormattedTransaction'
    MonthlyTransactionsBulkResponse:
      $ref: './schemas/transaction.yaml#/MonthlyTransactionsBulkResponse'

    # Fixed Expense Schemas
    FixedExpense:
      $ref: './schemas/fixed_expense.yaml#/FixedExpense'
    StoreFixedExpenseRequest:
      $ref: './schemas/fixed_expense.yaml#/StoreFixedExpenseRequest'
    UpdateFixedExpenseRequest:
      $ref: './schemas/fixed_expense.yaml#/UpdateFixedExpenseRequest'

    # Split Group Schemas
    SplitGroup:
      $ref: './schemas/split_group.yaml#/SplitGroup'
    SplitGroupSetting:
      $ref: './schemas/split_group.yaml#/SplitGroupSetting'
    SplitGroupCategoryOverride:
      $ref: './schemas/split_group.yaml#/SplitGroupCategoryOverride'
    StoreSplitGroupRequest:
      $ref: './schemas/split_group.yaml#/StoreSplitGroupRequest'
    UpdateSplitGroupRequest:
      $ref: './schemas/split_group.yaml#/UpdateSplitGroupRequest'
    UpdateSplitGroupSettingsRequest:
      $ref: './schemas/split_group.yaml#/UpdateSplitGroupSettingsRequest'
    UpdateCategoryOverridesRequest:
      $ref: './schemas/split_group.yaml#/UpdateCategoryOverridesRequest'
    SplitGroupMonthlySummary:
      $ref: './schemas/split_group.yaml#/SplitGroupMonthlySummary'
    SplitGroupPreviewResponse:
      $ref: './schemas/split_group.yaml#/SplitGroupPreviewResponse'

    # Common Schemas
    Error:
      $ref: './schemas/common.yaml#/Error'
    ValidationError:
      $ref: './schemas/common.yaml#/ValidationError'
    UnauthorizedError:
      $ref: './schemas/common.yaml#/UnauthorizedError'
    HealthCheckResponse:
      $ref: './schemas/common.yaml#/HealthCheckResponse'
    MessageResponse:
      $ref: './schemas/common.yaml#/MessageResponse'
    LoginResponse:
      $ref: './schemas/common.yaml#/LoginResponse'
    RegisterResponse:
      $ref: './schemas/common.yaml#/RegisterResponse'
    SocialLoginRequest:
      $ref: './schemas/common.yaml#/SocialLoginRequest'
    OAuthUrlResponse:
      $ref: './schemas/common.yaml#/OAuthUrlResponse'
