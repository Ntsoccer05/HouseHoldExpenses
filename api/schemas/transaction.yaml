Transaction:
  type: object
  properties:
    id:
      type: integer
      example: 1
    user_id:
      type: integer
      example: 1
    type_id:
      type: integer
      example: 2
    category_id:
      type: integer
      example: 1
    amount:
      type: integer
      example: 5000
    content:
      type: string
      nullable: true
      example: スーパー
    recorded_at:
      type: string
      format: date-time
      example: 2026-04-12T10:30:00Z
    created_at:
      type: string
      format: date-time
      example: 2026-04-12T10:30:00Z
    updated_at:
      type: string
      format: date-time
      example: 2026-04-12T10:30:00Z

Type:
  type: object
  properties:
    id:
      type: integer
      example: 1
    name:
      type: string
      nullable: true
      example: income
    en_name:
      type: string
      nullable: true
      example: Income
    created_at:
      type: string
      format: date-time
      example: 2026-01-01T00:00:00Z
    updated_at:
      type: string
      format: date-time
      example: 2026-04-12T10:30:00Z

AddTransactionRequest:
  type: object
  required:
    - amount
    - category_id
    - type_id
  properties:
    amount:
      type: integer
      example: 5000
    content:
      type: string
      example: スーパー
    category_id:
      type: integer
      example: 1
    type_id:
      type: integer
      example: 2
    recorded_at:
      type: string
      format: date-time
      example: 2026-04-12T10:30:00Z

UpdateTransactionRequest:
  type: object
  required:
    - id
    - amount
  properties:
    id:
      type: integer
      example: 1
    amount:
      type: integer
      example: 5000
    content:
      type: string
      example: スーパー
    category_id:
      type: integer
      example: 1
    recorded_at:
      type: string
      format: date-time

DeleteTransactionRequest:
  type: object
  required:
    - id
  properties:
    id:
      type: integer
      example: 1

MonthlySummary:
  type: object
  properties:
    year:
      type: integer
      example: 2026
    month:
      type: integer
      example: 4
    total_income:
      type: integer
      example: 500000
    total_expense:
      type: integer
      example: 200000
    by_category:
      type: array
      items:
        type: object
        properties:
          category:
            type: string
            example: 食費
          amount:
            type: integer
            example: 50000

YearlySummary:
  type: object
  properties:
    year:
      type: integer
      example: 2026
    months:
      type: array
      items:
        type: object
        properties:
          month:
            type: integer
            example: 1
          total_income:
            type: integer
            example: 500000
          total_expense:
            type: integer
            example: 200000

CopyMultipleContentsRequest:
  type: object
  required:
    - source_date
    - destination_date
    - content_ids
  properties:
    source_date:
      type: string
      format: date
      example: 2026-03-14
    destination_date:
      type: string
      format: date
      example: 2026-04-14
    content_ids:
      type: array
      items:
        type: integer
      minItems: 1
      example: [1, 3, 5]

CopyMultipleContentsResponse:
  type: object
  properties:
    success:
      type: boolean
      example: true
    message:
      type: string
      example: 3件の支出をコピーしました
    copied_count:
      type: integer
      example: 3
    created_ids:
      type: array
      items:
        type: integer
      example: [101, 102, 103]

FormattedTransaction:
  description: 表示用に整形された取引データ（カテゴリ名・アイコンを結合済み）
  type: object
  properties:
    id:
      type: integer
      example: 1
    date:
      type: string
      format: date
      example: 2026-05-14
    amount:
      type: integer
      example: 5000
    content:
      type: string
      nullable: true
      example: スーパー
    type:
      type: string
      enum: [income, expense]
      example: expense
    category:
      type: string
      nullable: true
      example: 食費
    icon:
      type: string
      nullable: true
      example: 🍽️
    isFixedExpense:
      type: boolean
      example: false
    fixedExpenseId:
      type: integer
      nullable: true
      example: null

MonthlyTransactionsBulkResponse:
  type: object
  description: >
    基準月（base_month）を中心に前々月・前月・当月・翌月の4ヶ月分を
    "YYYYMM" 形式の年月をキーとして返す
  additionalProperties:
    type: array
    items:
      $ref: '#/FormattedTransaction'
  example:
    "202603":
      - id: 10
        date: 2026-03-05
        amount: 3000
        content: スーパー
        type: expense
        category: 食費
        icon: 🍽️
        isFixedExpense: false
        fixedExpenseId: null
    "202604": []
