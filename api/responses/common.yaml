Unauthorized:
  description: 認証失敗
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/UnauthorizedError'

Forbidden:
  description: 権限がありません（リソース所有者ではない）
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 403
          message:
            type: string
            example: 権限がありません

ValidationError:
  description: バリデーションエラー
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/ValidationError'

Success:
  description: 成功
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/MessageResponse'

HealthCheckSuccess:
  description: サーバー正常
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/HealthCheckResponse'

LoginSuccess:
  description: ログイン成功
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/LoginResponse'

RegisterSuccess:
  description: 仮登録成功（確認メール送信）
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/RegisterResponse'

OAuthUrlSuccess:
  description: OAuth URL
  content:
    application/json:
      schema:
        $ref: '../schemas/common.yaml#/OAuthUrlResponse'

IncomeCategoryArraySuccess:
  description: 収入カテゴリ一覧
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: '../schemas/category.yaml#/IncomeCategory'

ExpenseCategoryArraySuccess:
  description: 支出カテゴリ一覧
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: '../schemas/category.yaml#/ExpenseCategory'

IncomeCategorySuccess:
  description: カテゴリ追加成功
  content:
    application/json:
      schema:
        $ref: '../schemas/category.yaml#/IncomeCategory'

ExpenseCategorySuccess:
  description: カテゴリ追加成功
  content:
    application/json:
      schema:
        $ref: '../schemas/category.yaml#/ExpenseCategory'

TransactionSuccess:
  description: 取引記録成功
  content:
    application/json:
      schema:
        $ref: '../schemas/transaction.yaml#/Transaction'

TransactionArraySuccess:
  description: 取引一覧
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: '../schemas/transaction.yaml#/Transaction'

MonthlySummarySuccess:
  description: 月別サマリー
  content:
    application/json:
      schema:
        $ref: '../schemas/transaction.yaml#/MonthlySummary'

YearlySummarySuccess:
  description: 年別サマリー
  content:
    application/json:
      schema:
        $ref: '../schemas/transaction.yaml#/YearlySummary'

CopyMultipleContentsSuccess:
  description: 複数支出コピー成功
  content:
    application/json:
      schema:
        $ref: '../schemas/transaction.yaml#/CopyMultipleContentsResponse'

CopyMultipleContentsError:
  description: 複数支出コピーエラー
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: boolean
            example: false
          message:
            type: string
            example: コピー先の日付は異なる日付を選択してください
          error_code:
            type: string
            example: SAME_DATE_ERROR

MonthlyTransactionsBulkSuccess:
  description: 複数月分の取引一括取得成功
  content:
    application/json:
      schema:
        $ref: '../schemas/transaction.yaml#/MonthlyTransactionsBulkResponse'

# ============= Fixed Expense =============
FixedExpenseArraySuccess:
  description: 固定費一覧取得成功
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 200
          fixedExpenses:
            type: array
            items:
              $ref: '../schemas/fixed_expense.yaml#/FixedExpense'

FixedExpenseSuccess:
  description: 固定費の作成・更新成功
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 200
          message:
            type: string
            example: 固定費を作成しました
          fixedExpense:
            $ref: '../schemas/fixed_expense.yaml#/FixedExpense'

# ============= Split Group =============
SplitGroupArraySuccess:
  description: 分担グループ一覧取得成功
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 200
          splitGroups:
            type: array
            items:
              $ref: '../schemas/split_group.yaml#/SplitGroup'

SplitGroupSuccess:
  description: 分担グループの作成・更新・設定更新成功
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 200
          splitGroup:
            $ref: '../schemas/split_group.yaml#/SplitGroup'

CategoryOverridesSuccess:
  description: カテゴリ別上書き設定の取得・更新成功
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 200
          categoryOverrides:
            type: array
            items:
              $ref: '../schemas/split_group.yaml#/SplitGroupCategoryOverride'

SplitGroupPreviewSuccess:
  description: 分担プレビュー取得成功
  content:
    application/json:
      schema:
        $ref: '../schemas/split_group.yaml#/SplitGroupPreviewResponse'

SplitGroupMonthlySummarySuccess:
  description: 月次サマリー（グループなし共有用）取得成功
  content:
    application/json:
      schema:
        $ref: '../schemas/split_group.yaml#/SplitGroupMonthlySummary'
